name: SupportLLM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install only the test requirements to keep CI light and fast
        pip install fastapi uvicorn pydantic scikit-learn rouge-score pytest ruff httpx

    - name: Lint with Ruff
      run: ruff check .

    - name: Run Pytest
      run: pytest tests/
